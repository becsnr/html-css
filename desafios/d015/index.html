<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <div id="imagem">
            <!-- <img src="imagens/login.jpg" alt="Céu"> -->
        </div>

        <div id="login">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>

            <form action="#">
                <div class="dados">
                    <label for="iemail"><span class="material-symbols-outlined">person</span></label>
                    <input type="email" name="email" id="iemail" placeholder="Seu e-mail">
                </div>

                <div class="dados">
                    <label for="isenha"><span class="material-symbols-outlined">key</span></label>
                    <input type="password" name="senha" id="isenha" placeholder="Sua senha" min="8" max="15">
                </div>

                <div id="entrar">
                    <button type="submit">Entrar</button>
                </div>

                <div class="botoes">
                    <a href="#">Esqueci a senha<span class="material-symbols-outlined">mail</span></a>
                </div> 
            </form>
        </div>
    </main>
</body>
</html>
