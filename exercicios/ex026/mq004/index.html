<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Query</title>
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <!-- MOBILE FIRST 
        Constroi a versão móvel primeiro, e depois reposiciona as coisas pra versãp desktop e afins.
        Vantagens: facilidade na divulgação do seu site. O algoritmo do Google vai valorizar sites desenvolvidos com foco em Mobile First; Melhoria na experiência do usuário.
    -->
    <main>
        <h1>Testando Media Queries</h1>
        <img id="phone" src="imagens/icon-phone.png" alt="Versão para smartphone">
        <img id="tablet" src="imagens/icon-tablet.png" alt="Versão para tablet">
        <img id="print" src="imagens/icon-print.png" alt="Versão para impressão">
        <img id="pc" src="imagens/icon-pc.png" alt="Versão para desktop">
        <img id="tv" src="imagens/icon-tv.png" alt="Versão para TV">
    </main>
</body>
</html>
